[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yadisk-client-local"
version = "0.3.2"
description = "Yandex Disk Python client and CLI with recursive, parallel and verified transfers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "python-dotenv>=1,<2"]

[project.scripts]
yd = "yadisk_client.cli:main"
yadisk = "yadisk_client.cli:main"
yadisk-backup = "yadisk_client.service:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yadisk_client = ["py.typed"]
